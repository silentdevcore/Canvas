groups:
  - name: pvad-mcp
    rules:
      - alert: PvadMcpDependencyUnavailable
        expr: '{__name__=~"(pvad|pxa)_mcp_dependency_ready"} == 0'
        for: 2m
        labels:
          severity: critical
          service: pvad-mcp
        annotations:
          summary: PVAD MCP dependency is unavailable
          description: The MCP host cannot reach a required API or identity dependency.
      - alert: PvadMcpServerErrors
        expr: 'sum(rate({__name__=~"(pvad|pxa)_mcp_http_requests_total",route="/mcp",status=~"5.."}[5m])) > 0.1'
        for: 5m
        labels:
          severity: warning
          service: pvad-mcp
        annotations:
          summary: PVAD MCP server errors are elevated
          description: The remote MCP endpoint is returning elevated server errors.
      - alert: PvadMcpAuthorizationFailures
        expr: 'sum(rate({__name__=~"(pvad|pxa)_mcp_http_requests_total",route="/mcp",status=~"401|403"}[5m])) > 1'
        for: 10m
        labels:
          severity: warning
          service: pvad-mcp
        annotations:
          summary: PVAD MCP authorization failures are elevated
          description: Authentication or authorization failures exceed the expected baseline.
