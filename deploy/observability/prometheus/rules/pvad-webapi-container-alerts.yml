groups:
  - name: pvad-api-container
    rules:
      - alert: PvadWebApiContainerTelemetryMissing
        expr: |
          time() - max(
            {__name__=~"pvad_service_heartbeat_seconds",
              service_instance_id=~"pvad-webapi-container"
            }
          ) > 120
        labels:
          severity: critical
          service: pvad-webapi
          environment: container
        annotations:
          summary: The PVAD WebApi container telemetry is missing
          description: No dependency-health metric arrived from the expected WebApi container for two minutes.
          dashboard_path: /d/pvad-platform-overview/pvad-platform-overview
          runbook_id: PVAD-OBS-034
