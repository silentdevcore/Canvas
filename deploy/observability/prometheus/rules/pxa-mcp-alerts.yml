groups:
  - name: pxa-mcp
    rules:
      - alert: PxaMcpDependencyUnavailable
        expr: pxa_mcp_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
          service: pxa-mcp
        annotations:
          summary: PXA MCP dependency is unavailable
          description: The MCP host cannot reach a required API or identity dependency.

      - alert: PxaMcpServerErrors
        expr: sum(rate(pxa_mcp_http_requests_total{route="/mcp",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: pxa-mcp
        annotations:
          summary: PXA MCP server errors are elevated
          description: The remote MCP endpoint is returning elevated server errors.

      - alert: PxaMcpAuthorizationFailures
        expr: sum(rate(pxa_mcp_http_requests_total{route="/mcp",status=~"401|403"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: pxa-mcp
        annotations:
          summary: PXA MCP authorization failures are elevated
          description: Authentication or authorization failures exceed the expected baseline.
