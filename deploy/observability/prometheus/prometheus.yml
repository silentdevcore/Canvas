global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: pxa
    environment: local-evaluation

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["pxa-alertmanager:9093"]

scrape_configs:
  - job_name: pxa-otel-collector
    static_configs:
      - targets: ["pxa-otel-collector:8889"]

  - job_name: pxa-postgresql
    static_configs:
      - targets: ["pxa-postgres-exporter:9187"]

  - job_name: pxa-containers
    static_configs:
      - targets: ["pxa-cadvisor:8080"]

  - job_name: pxa-tls
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pxa-blackbox-exporter:9115
