global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: pvad
    environment: local-evaluation

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["pvad-alertmanager:9093"]

scrape_configs:
  - job_name: pvad-otel-collector
    static_configs:
      - targets: ["pvad-otel-collector:8889"]

  - job_name: pvad-postgresql
    static_configs:
      - targets: ["pvad-postgres-exporter:9187"]

  - job_name: pvad-containers
    static_configs:
      - targets: ["pvad-cadvisor:8080"]

  - job_name: pvad-mcp
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mcp-targets.json
        refresh_interval: 1m

  - job_name: pvad-tls
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pvad-blackbox-exporter:9115
