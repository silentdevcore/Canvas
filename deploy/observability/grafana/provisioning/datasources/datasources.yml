apiVersion: 1

deleteDatasources:
  # Remove only the obsolete datasource, never delete active UIDs during rename.
  - name: PVAD Alertmanager
    orgId: 1

datasources:
  - name: PVAD Prometheus
    uid: pvad-prometheus
    type: prometheus
    access: proxy
    url: http://pvad-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: pvad-tempo

  - name: PVAD Loki
    uid: pvad-loki
    type: loki
    access: proxy
    url: http://pvad-loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace ID
          matcherRegex: '"TraceId":"([a-f0-9]{32})"'
          datasourceUid: pvad-tempo
          url: "$${__value.raw}"

  - name: PVAD Tempo
    uid: pvad-tempo
    type: tempo
    access: proxy
    url: http://pvad-tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: pvad-loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: pvad-prometheus
      serviceMap:
        datasourceUid: pvad-prometheus
      streamingEnabled:
        search: false
        metrics: false
