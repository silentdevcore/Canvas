apiVersion: 1

providers:
  # Retained provisioning identity and folder: migrating installed dashboard
  # placement and folder permissions requires a separate coordinated cutover.
  - name: PXA
    orgId: 1
    folder: PXA
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
