global:
  resolve_timeout: 5m
  smtp_from: pvad-alerts@example.test
  smtp_smarthost: pvad-mailpit:1025
  smtp_require_tls: false

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: operator-email
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: operator-email
      matchers:
        - severity="critical"
      mute_time_intervals: [pvad-maintenance-window]
      repeat_interval: 30m
    - receiver: operator-email
      matchers:
        - severity="warning"
      mute_time_intervals: [pvad-maintenance-window]
      repeat_interval: 2h
    - receiver: operator-email
      matchers:
        - severity="info"
      mute_time_intervals: [pvad-maintenance-window]
      repeat_interval: 12h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: [service, environment]

time_intervals:
  - name: pvad-maintenance-window
    time_intervals:
      - weekdays: [saturday, sunday]
        times:
          - start_time: "01:00"
            end_time: "03:00"
        location: Europe/Berlin

receivers:
  - name: operator-email
    email_configs:
      - to: pvad-operators@example.test
        send_resolved: true
        headers:
          Subject: '{{ template "pvad.email.subject" . }}'
        html: '{{ template "pvad.email.html" . }}'
        text: '{{ template "pvad.email.text" . }}'
        threading:
          enabled: true
          thread_by_date: none
