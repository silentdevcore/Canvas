services:
  pvad-alertmanager:
    volumes:
      - '${PVAD_ALERTMANAGER_CONFIG_FILE:?Set PVAD_ALERTMANAGER_CONFIG_FILE}:/etc/alertmanager/alertmanager.yml:ro'
      - '${PVAD_ALERTMANAGER_TEMPLATES_DIR:?Set PVAD_ALERTMANAGER_TEMPLATES_DIR}:/etc/alertmanager/templates:ro'
    secrets:
      - pvad_alertmanager_smtp_password
secrets:
  pvad_alertmanager_smtp_password:
    file: '${PVAD_ALERTMANAGER_SMTP_PASSWORD_FILE:?Set PVAD_ALERTMANAGER_SMTP_PASSWORD_FILE}'
