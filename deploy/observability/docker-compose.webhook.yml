services:
  pvad-webhook-relay:
    build:
      context: .
      dockerfile: src/Observability/PVAD.Observability.WebhookRelay/Dockerfile
    environment:
      WebhookRelay__Destination: '${PVAD_ALERT_WEBHOOK_URL:?Set PVAD_ALERT_WEBHOOK_URL}'
      WebhookRelay__SecretFile: /run/secrets/pvad_alert_webhook_signing_key
      WebhookRelay__MaxPayloadBytes: '${PVAD_ALERT_WEBHOOK_MAX_PAYLOAD_BYTES:-262144}'
      WebhookRelay__RequestTimeoutSeconds: '${PVAD_ALERT_WEBHOOK_TIMEOUT_SECONDS:-15}'
    secrets:
      - pvad_alert_webhook_signing_key
    networks:
      pvad-observability: {}
      pvad-operator-egress: {}
    healthcheck:
      test:
        - CMD
        - dotnet
        - PVAD.Observability.WebhookRelay.dll
        - '--health-check'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_ALERT_WEBHOOK_CPU_LIMIT:-0.25}'
          memory: '${PVAD_ALERT_WEBHOOK_MEMORY_LIMIT:-128M}'
    restart: unless-stopped
secrets:
  pvad_alert_webhook_signing_key:
    file: '${PVAD_ALERT_WEBHOOK_SIGNING_KEY_FILE:?Set PVAD_ALERT_WEBHOOK_SIGNING_KEY_FILE}'
