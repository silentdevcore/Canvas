# Compatibility baseline enforced now; resource restrictions remain report-only.
# No reporting endpoint is configured: document URLs must not be sent to third parties.
add_header Content-Security-Policy "base-uri 'self'; object-src 'self' blob:; frame-ancestors 'none'; form-action 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; base-uri 'self'; object-src 'self' blob:; frame-ancestors 'none'; form-action 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
