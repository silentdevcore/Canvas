version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      test-platform:
        patterns: ["Microsoft.NET.Test.Sdk"]
    # ASP.NET Core 10 requires OpenAPI.NET 2.x. Revisit with a platform upgrade.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/pxa-designer"
    target-branch: "develop"
    groups:
      react-runtime:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    # Owner-selected stable Grid requires React 18; Node types follow Node 22.
    # Compatible updates and the existing security-update policy remain enabled.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
  - package-ecosystem: "npm"
    directory: "/websites/PXA.Admin"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "npm"
    directory: "/tools/PXA.Mcp"
    target-branch: "develop"
    # Node declarations follow the validated runtime. Revisit with a Node upgrade;
    # compatible updates remain enabled and security-update policy is unchanged.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "docker"
    directory: "/PXA.WebApi"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
