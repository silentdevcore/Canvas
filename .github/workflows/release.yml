name: PVAD Stable Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  # Retained lock identity; change only after previous runs are drained.
  # See docs/pvad-rename-release-approvals.md#retained-workflow-bindings.
  group: pxa-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate immutable release version
        id: version
        run: |
          node --test tools/versioning/pvad-version.test.mjs
          node --test tools/versioning/pvad-build-consistency.test.mjs
          node tools/versioning/pvad-version.mjs check
          VERSION="$(cat VERSION)"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists. Published versions are immutable."
            exit 1
          fi
          PREVIOUS="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          if [ -z "$PREVIOUS" ]; then
            echo "No previous stable PVADE tag exists."
            exit 1
          fi
          node tools/versioning/pvad-version.mjs validate-next --base "$PREVIOUS"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        env:
          PVAD_BUILD_COMMIT: ${{ github.sha }}
          PVAD_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          dotnet restore PVAD.WebApi/PVAD.WebApi.csproj
          dotnet publish PVAD.WebApi/PVAD.WebApi.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/webapi \
            -p:SkipOcrWorkerPackaging=true \
            -p:PvadBuildMetadata="${GITHUB_SHA::12}"
          node tools/versioning/pvad-build-consistency.mjs write artifacts/webapi
          npm ci --prefix pvad-designer
          npm --prefix pvad-designer run build
          npm ci --prefix websites/PVAD.Admin
          npm --prefix websites/PVAD.Admin run build
          for site in PVAD.Account PVAD.Company PVAD.Demo PVAD.Documentation; do
            npm --prefix "websites/$site" run build
          done
          tar -czf "artifacts/pvad-webapi-${{ steps.version.outputs.version }}.tar.gz" -C artifacts/webapi .
          tar -czf "artifacts/pvad-designer-${{ steps.version.outputs.version }}.tar.gz" -C pvad-designer/dist .
          for site in PVAD.Account PVAD.Admin PVAD.Company PVAD.Demo PVAD.Documentation; do
            name="$(printf '%s' "$site" | tr '[:upper:]' '[:lower:]' | tr '.' '-')"
            tar -czf "artifacts/$name-${{ steps.version.outputs.version }}.tar.gz" \
              -C "websites/$site/dist" .
          done
          node tools/versioning/pvad-build-consistency.mjs verify \
            artifacts/webapi \
            pvad-designer/dist \
            websites/PVAD.Account/dist \
            websites/PVAD.Admin/dist \
            websites/PVAD.Company/dist \
            websites/PVAD.Demo/dist \
            websites/PVAD.Documentation/dist
          node tools/versioning/pvad-version.mjs notes > artifacts/RELEASE_NOTES.md
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry targets are retained pending an owner-approved publisher cutover.
      # Canonical product names do not establish registry ownership or permission.
      - name: Build and publish WebApi container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: PVAD.WebApi/Dockerfile
          push: true
          build-args: |
            PVAD_VERSION=${{ steps.version.outputs.version }}
            PVAD_COMMIT=${{ github.sha }}
            PVAD_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pxa-webapi:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pxa-webapi:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/pxa-webapi:latest
      - name: Verify published WebApi container version
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/pxa-webapi:${{ steps.version.outputs.version }}
          node tools/versioning/pvad-build-consistency.mjs verify-container-metadata \
            ghcr.io/${{ github.repository_owner }}/pxa-webapi:${{ steps.version.outputs.version }} \
            "${{ github.sha }}" "${{ github.event.head_commit.timestamp }}"
      - name: Build and publish observability relay container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Observability/PVAD.Observability.WebhookRelay/Dockerfile
          push: true
          build-args: |
            PVAD_VERSION=${{ steps.version.outputs.version }}
            PVAD_COMMIT=${{ github.sha }}
            PVAD_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pxa-observability-webhook-relay:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pxa-observability-webhook-relay:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/pxa-observability-webhook-relay:latest
      - name: Verify published observability relay container version
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/pxa-observability-webhook-relay:${{ steps.version.outputs.version }}
          node tools/versioning/pvad-build-consistency.mjs verify-container-metadata \
            ghcr.io/${{ github.repository_owner }}/pxa-observability-webhook-relay:${{ steps.version.outputs.version }} \
            "${{ github.sha }}" "${{ github.event.head_commit.timestamp }}"
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" --message "PVADE $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            artifacts/pvad-*-"$VERSION".tar.gz \
            --title "PVADE $VERSION" \
            --notes-file artifacts/RELEASE_NOTES.md \
            --verify-tag
