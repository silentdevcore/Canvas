name: PVADE Deployment Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable PVADE version without the v prefix
        required: true
        type: string
      container_identity:
        description: Exact image family published for this immutable release; never infer it from archive names
        required: true
        default: PXA
        type: choice
        options: [PXA, PVAD]
      environment:
        description: Protected target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      operation:
        description: Intended immutable deployment operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - retry
          - rollback
      source_run_id:
        description: Required source workflow run ID for retry or rollback
        required: false
        type: string
      confirm:
        description: Confirm validation against the protected environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  deployments: write

concurrency:
  # Canonical lock: drain legacy runs before activating on protected branches.
  # See docs/pvad-rename-release-approvals.md#workflow-lock-cutover.
  group: pvad-deployment-${{ inputs.environment }}
  cancel-in-progress: false

env:
  PVAD_CONTAINER_PUBLISHER: silentdevcore

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require protected control branch
        run: test "$GITHUB_REF" = refs/heads/develop
      - name: Require approved container publisher
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$OWNER" != "$PVAD_CONTAINER_PUBLISHER" ]; then
            echo "Container inspection requires the approved repository owner." >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate confirmed deployment request
        env:
          CONFIRM: ${{ inputs.confirm }}
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "Deployment validation requires explicit confirmation."
            exit 1
          fi
          node tools/deployment/pvad-deployment.mjs request \
            --version "$VERSION" \
            --environment "$ENVIRONMENT" \
            --operation "$OPERATION" \
            --source-run-id "$SOURCE_RUN_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          path: release-source
          fetch-depth: 0
      - name: Validate immutable GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/deployment
          gh release view "v$VERSION" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets \
            > artifacts/deployment/github-release.json
          node tools/deployment/pvad-deployment.mjs verify \
            --version "$VERSION" \
            --release-root release-source \
            --metadata artifacts/deployment/github-release.json \
            --output artifacts/deployment/verified-release.json
          node -e '
            const fs = require("node:fs");
            const release = require("./artifacts/deployment/verified-release.json");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_url=${release.releaseUrl}\n`);
          '
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Preserve each historical image family; new releases use PVAD in release.yml.
      - name: Verify immutable container tags
        env:
          OWNER: ${{ env.PVAD_CONTAINER_PUBLISHER }}
          VERSION: ${{ inputs.version }}
          CONTAINER_IDENTITY: ${{ inputs.container_identity }}
        run: |
          OWNER="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          case "$CONTAINER_IDENTITY" in
            PVAD) PREFIX=pvad ;;
            PXA) PREFIX=pxa ;;
            *) echo "Unknown container identity." >&2; exit 1 ;;
          esac
          WEBAPI="ghcr.io/$OWNER/$PREFIX-webapi:$VERSION"
          RELAY="ghcr.io/$OWNER/$PREFIX-observability-webhook-relay:$VERSION"
          docker buildx imagetools inspect "$WEBAPI" > artifacts/deployment/webapi-image.txt
          docker buildx imagetools inspect "$RELAY" > artifacts/deployment/relay-image.txt
          WEBAPI_DIGEST="$(awk '/^Digest:/ {print $2; exit}' artifacts/deployment/webapi-image.txt)"
          RELAY_DIGEST="$(awk '/^Digest:/ {print $2; exit}' artifacts/deployment/relay-image.txt)"
          test -n "$WEBAPI_DIGEST"
          test -n "$RELAY_DIGEST"
          node -e '
            const fs = require("node:fs");
            const [webapi, webapiDigest, relay, relayDigest] = process.argv.slice(1);
            fs.writeFileSync("artifacts/deployment/containers.json", JSON.stringify([
              { image: webapi, digest: webapiDigest },
              { image: relay, digest: relayDigest }
            ], null, 2) + "\n");
          ' "$WEBAPI" "$WEBAPI_DIGEST" "$RELAY" "$RELAY_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvad-deployment-preflight-${{ github.run_id }}
          path: artifacts/deployment
          if-no-files-found: error
          retention-days: 30

  validate-environment:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      # Retained protected environment: verify reviewers, secrets and branch rules
      # before changing its name. Do not bypass approvals with a new environment.
      name: pxa-${{ inputs.environment }}
      url: ${{ needs.preflight.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pvad-deployment-preflight-${{ github.run_id }}
          path: artifacts/deployment
      - name: Record protected validation evidence
        env:
          ACTOR: ${{ github.actor }}
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          STARTED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          node tools/deployment/pvad-deployment.mjs record \
            --release artifacts/deployment/verified-release.json \
            --containers artifacts/deployment/containers.json \
            --environment "$ENVIRONMENT" \
            --operation "$OPERATION" \
            --source-run-id "$SOURCE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --actor "$ACTOR" \
            --repository "$REPOSITORY" \
            --status validated \
            --started-at "$STARTED_AT" \
            --completed-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --output artifacts/deployment/deployment-evidence.json
          {
            printf '## PVADE deployment validation\n\n'
            printf -- '- Version: `%s`\n' "${{ inputs.version }}"
            printf -- '- Environment: `%s`\n' "$ENVIRONMENT"
            printf -- '- Operation: `%s`\n' "$OPERATION"
            printf -- '- Status: `validated`\n'
            printf -- '- No target adapter executed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvad-deployment-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: artifacts/deployment/deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
