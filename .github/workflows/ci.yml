  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build traceable snapshot
        env:
          PVAD_BUILD_COMMIT: ${{ github.sha }}
          PVAD_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          VERSION="$(cat VERSION)"
          dotnet restore PVAD.WebApi/PVAD.WebApi.csproj
          dotnet publish PVAD.WebApi/PVAD.WebApi.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/webapi \
            -p:SkipOcrWorkerPackaging=true \
            -p:PvadBuildMetadata="develop.${{ github.run_number }}.${GITHUB_SHA::12}"
          node tools/versioning/pvad-build-consistency.mjs write artifacts/webapi
          node tools/versioning/pvad-build-consistency.mjs verify artifacts/webapi
          printf '%s\n' "$VERSION-develop.${{ github.run_number }}-${GITHUB_SHA::12}" > artifacts/SNAPSHOT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pvad-${{ github.run_number }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    needs: [dotnet, frontend, dependency-security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pvad-designer/package-lock.json
      - name: Install SPDX SBOM generator
        run: dotnet tool install --tool-path .tools Microsoft.Sbom.DotNetTool --version 4.1.5
      - name: Publish WebApi and build Designer
        env:
          PVAD_BUILD_COMMIT: ${{ github.sha }}
          PVAD_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: |
          dotnet restore PVAD.WebApi/PVAD.WebApi.csproj
          dotnet publish PVAD.WebApi/PVAD.WebApi.csproj --configuration Release --no-restore --output artifacts/webapi -p:SkipOcrWorkerPackaging=true
          node tools/versioning/pvad-build-consistency.mjs write artifacts/webapi
          npm --prefix pvad-designer ci
          npm --prefix pvad-designer run build
          node tools/versioning/pvad-build-consistency.mjs verify artifacts/webapi pvad-designer/dist
      - name: Build WebApi container
        env:
          PVAD_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: |
          VERSION="$(cat VERSION)"
          test -n "$PVAD_BUILD_TIME"
          docker build --file PVAD.WebApi/Dockerfile --tag pvad-webapi:sbom --build-arg PVAD_VERSION="$VERSION" --build-arg PVAD_COMMIT="$GITHUB_SHA" --build-arg PVAD_BUILD_TIME="$PVAD_BUILD_TIME" .
          node tools/versioning/pvad-build-consistency.mjs verify-container-metadata pvad-webapi:sbom "$GITHUB_SHA" "$PVAD_BUILD_TIME"
      - name: Generate WebApi and Designer SPDX SBOMs
        run: |
          VERSION="$(cat VERSION)"
          .tools/sbom-tool generate -b artifacts/webapi -bc . -pn PVAD.WebApi -pv "$VERSION" -ps PVADE -nsb "https://pvade.com/sbom/PVAD.WebApi/$VERSION"
          .tools/sbom-tool generate -b pvad-designer/dist -bc pvad-designer -pn PVAD.Designer -pv "$VERSION" -ps PVADE -nsb "https://pvade.com/sbom/PVAD.Designer/$VERSION"
      - name: Prepare container SBOM output
        run: mkdir -p artifacts/sbom/webapi-container
      - name: Generate container SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: pvad-webapi:sbom
          format: spdx-json
          output-file: artifacts/sbom/webapi-container/manifest.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Collect SBOM artifacts
        run: |
          mkdir -p artifacts/sbom/webapi artifacts/sbom/designer
          cp -R artifacts/webapi/_manifest/. artifacts/sbom/webapi/
          cp -R pvad-designer/dist/_manifest/. artifacts/sbom/designer/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pvad-sbom-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/sbom
          if-no-files-found: error
          retention-days: 90
