name: PXA CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test version tooling
        run: |
          node --test tools/versioning/pxa-version.test.mjs
          node --test tools/versioning/pxa-release-author.test.mjs
          node --test tools/versioning/pxa-build-consistency.test.mjs
          node --test tools/deployment/pxa-deployment.test.mjs
      - name: Check synchronized version metadata
        run: node tools/versioning/pxa-version.mjs check
      - name: Require a release fragment for develop pull requests
        if: >
          github.event_name == 'pull_request' &&
          github.base_ref == 'develop' &&
          !startsWith(github.head_ref, 'release/prepare-v')
        run: node tools/versioning/pxa-version.mjs validate-change --base-ref origin/develop
      - name: Validate stable release pull request
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE_VERSION="$(git show origin/main:VERSION 2>/dev/null || true)"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          fi
          if [ -z "$BASE_VERSION" ]; then
            echo "No stable PXA version exists on main."
            exit 1
          fi
          node tools/versioning/pxa-version.mjs validate-pr \
            --base "$BASE_VERSION" \
            --labels "$RELEASE_LABELS" \
            --head-ref "$HEAD_REF"
          if git rev-parse --verify --quiet "refs/tags/v$(cat VERSION)"; then
            echo "Tag v$(cat VERSION) already exists."
            exit 1
          fi

  dotnet:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PXA.sln
      - name: Build
        run: dotnet build PXA.sln --configuration Release --no-restore -p:SkipOcrWorkerPackaging=true
      - name: Test core contracts
        run: |
          dotnet test tests/PXA.Core.Tests/PXA.Core.Tests.csproj --configuration Release --no-build
          dotnet test tests/PXA.Application.Tests/PXA.Application.Tests.csproj --configuration Release --no-build
          dotnet test tests/PXA.Domain.Tests/PXA.Domain.Tests.csproj --configuration Release --no-build
          dotnet test tests/PXA.Observability.WebhookRelay.Tests/PXA.Observability.WebhookRelay.Tests.csproj --configuration Release --no-build
      - name: Test version and release metadata contracts
        run: >
          dotnet test tests/PXA.Api.Tests/PXA.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~PXA.Api.Tests.VersionControllerTests.|FullyQualifiedName~PXA.Api.Tests.DesignerProductExperienceTests.|FullyQualifiedName~PXA.Api.Tests.OperatorDocumentationContractTests."
          -p:SkipOcrWorkerPackaging=true
      - name: Test PostgreSQL legal deployment contract
        env:
          PXA_RUN_POSTGRES_TESTS: "1"
        run: >
          dotnet test tests/PXA.Api.Tests/PXA.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~AccountRegistrationControllerTests.Registration_requires_current_legal_versions_and_records_exact_acceptances|FullyQualifiedName~AdminSystemControllerTests"
          -p:SkipOcrWorkerPackaging=true
      - name: Verify local EF tooling and unchanged database model
        env:
          PXA_DATABASE_CONNECTION: Host=127.0.0.1;Port=1;Database=dependency_contract;Username=contract;Password=unused
        run: |
          dotnet tool restore
          dotnet ef --version
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure/PXA.Infrastructure.Persistence --startup-project PXA.WebApi --context PxaDbContext --configuration Release --no-build
      - name: Test API platform contracts with isolated PostgreSQL
        timeout-minutes: 15
        env:
          PXA_RUN_POSTGRES_TESTS: "1"
        run: |
          dotnet test tests/PXA.Infrastructure.Persistence.Tests/PXA.Infrastructure.Persistence.Tests.csproj --configuration Release --no-build -- xUnit.ParallelizeTestCollections=false
          dotnet test tests/PXA.Api.Tests/PXA.Api.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~ImageConversionControllerTests" -- xUnit.ParallelizeTestCollections=false
      - name: Test Roslyn-dependent migration providers
        timeout-minutes: 15
        run: |
          for project in tests/PXA.Migration.*.Tests/*.csproj; do
            dotnet test "$project" --configuration Release --no-build --no-restore
          done
      - name: Test isolated Legal backup and restore
        env:
          PXA_POSTGRES_STARTUP_DELAY_SECONDS: "2"
          PXA_POSTGRES_READY_ATTEMPTS: "90"
        run: tools/legal/run-backup-restore-smoke-test.sh

  dependency-security:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pxa-designer/package-lock.json
            websites/PXA.Admin/package-lock.json
            tools/PXA.Mcp/package-lock.json
      - name: Restore NuGet dependency graph
        run: dotnet restore PXA.sln
      - name: Reject vulnerable direct and transitive NuGet dependencies
        run: node tools/dependencies/check-nuget-vulnerabilities.mjs
      - name: Reject high and critical production npm vulnerabilities
        run: |
          npm --prefix pxa-designer audit --omit=dev --audit-level=high
          npm --prefix websites/PXA.Admin audit --omit=dev --audit-level=high
          npm --prefix tools/PXA.Mcp audit --omit=dev --audit-level=high
      - name: Validate dependency compliance policy
        run: |
          node tools/dependencies/validate-dependency-compliance.mjs
          node --test tools/dependencies/dependency-compliance.test.mjs

  frontend:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pxa-designer/package-lock.json
            websites/PXA.Admin/package-lock.json
            tools/PXA.Mcp/package-lock.json
      - name: Install Designer dependencies
        working-directory: pxa-designer
        run: npm ci
      - name: Test and build Designer
        working-directory: pxa-designer
        run: |
          npm run type-check
          npm test -- --runInBand
          npm run build
      - name: Install and test Admin
        working-directory: websites/PXA.Admin
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Account, Company, and Documentation
        run: |
          node tools/legal/validate-browser-storage.mjs
          node tools/legal/validate-data-processing-inventory.mjs
          npm --prefix websites/PXA.Account test
          npm --prefix websites/PXA.Account run type-check
          npm --prefix websites/PXA.Company test
          npm --prefix websites/PXA.Documentation test
      - name: Build PXA websites
        run: |
          for site in PXA.Account PXA.Company PXA.Demo PXA.Documentation; do
            npm --prefix "websites/$site" run build
          done
      - name: Verify frontend build versions
        run: |
          node tools/versioning/pxa-build-consistency.mjs verify \
            pxa-designer/dist \
            websites/PXA.Account/dist \
            websites/PXA.Admin/dist \
            websites/PXA.Company/dist \
            websites/PXA.Demo/dist \
            websites/PXA.Documentation/dist
      - name: Install Playwright Chromium
        working-directory: pxa-designer
        run: npx playwright install --with-deps chromium
      - name: Test legal browser workflows
        working-directory: pxa-designer
        run: npm run test:e2e:legal
      - name: Collect frontend snapshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p artifacts/frontends
          cp -R pxa-designer/dist artifacts/frontends/pxa-designer
          for site in PXA.Account PXA.Admin PXA.Company PXA.Demo PXA.Documentation; do
            cp -R "websites/$site/dist" "artifacts/frontends/$site"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: pxa-frontends-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/frontends
          if-no-files-found: error
          retention-days: 14
      - name: Install, type-check and smoke-test MCP tool
        working-directory: tools/PXA.Mcp
        run: |
          npm ci
          npm run test:contracts
          npm run typecheck
          npm run test:smoke

  artifact-contract:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test and create synthetic artifact fixture
        run: |
          node --test tools/deployment/artifact-handoff-contract.test.mjs
          node tools/deployment/artifact-handoff-contract.mjs create artifacts/artifact-contract/input
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxa-artifact-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/artifact-contract/input
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pxa-artifact-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/artifact-contract/output
      - name: Verify downloaded artifact names and hashes
        run: node tools/deployment/artifact-handoff-contract.mjs verify artifacts/artifact-contract/output

  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build traceable snapshot
        env:
          PXA_BUILD_COMMIT: ${{ github.sha }}
          PXA_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          VERSION="$(cat VERSION)"
          dotnet restore PXA.WebApi/PXA.WebApi.csproj
          dotnet publish PXA.WebApi/PXA.WebApi.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/webapi \
            -p:SkipOcrWorkerPackaging=true \
            -p:PxaBuildMetadata="develop.${{ github.run_number }}.${GITHUB_SHA::12}"
          node tools/versioning/pxa-build-consistency.mjs write artifacts/webapi
          node tools/versioning/pxa-build-consistency.mjs verify artifacts/webapi
          printf '%s\n' "$VERSION-develop.${{ github.run_number }}-${GITHUB_SHA::12}" > artifacts/SNAPSHOT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxa-${{ github.run_number }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    needs: [dotnet, frontend, dependency-security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pxa-designer/package-lock.json
      - name: Install SPDX SBOM generator
        run: dotnet tool install --tool-path .tools Microsoft.Sbom.DotNetTool --version 4.1.5
      - name: Publish WebApi and build Designer
        env:
          PXA_BUILD_COMMIT: ${{ github.sha }}
          PXA_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: |
          dotnet restore PXA.WebApi/PXA.WebApi.csproj
          dotnet publish PXA.WebApi/PXA.WebApi.csproj --configuration Release --no-restore --output artifacts/webapi -p:SkipOcrWorkerPackaging=true
          node tools/versioning/pxa-build-consistency.mjs write artifacts/webapi
          npm --prefix pxa-designer ci
          npm --prefix pxa-designer run build
          node tools/versioning/pxa-build-consistency.mjs verify artifacts/webapi pxa-designer/dist
      - name: Set up the release container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify the container builder
        run: docker buildx inspect --bootstrap
      - name: Read container build version
        id: container-version
        run: printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build WebApi container without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: PXA.WebApi/Dockerfile
          tags: pxa-webapi:sbom
          load: true
          push: false
          provenance: false
          build-args: |
            PXA_VERSION=${{ steps.container-version.outputs.version }}
            PXA_COMMIT=${{ github.sha }}
      - name: Verify built container version
        run: node tools/versioning/pxa-build-consistency.mjs verify-container pxa-webapi:sbom
      - name: Generate WebApi and Designer SPDX SBOMs
        run: |
          VERSION="$(cat VERSION)"
          .tools/sbom-tool generate -b artifacts/webapi -bc . -pn PXA.WebApi -pv "$VERSION" -ps PowerDox -nsb "https://powerdoxautomation.com/sbom/PXA.WebApi/$VERSION"
          .tools/sbom-tool generate -b pxa-designer/dist -bc pxa-designer -pn PXA.Designer -pv "$VERSION" -ps PowerDox -nsb "https://powerdoxautomation.com/sbom/PXA.Designer/$VERSION"
      - name: Prepare container SBOM output
        run: mkdir -p artifacts/sbom/webapi-container
      - name: Generate container SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pxa-webapi:sbom
          format: spdx-json
          output-file: artifacts/sbom/webapi-container/manifest.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Collect SBOM artifacts
        run: |
          mkdir -p artifacts/sbom/webapi artifacts/sbom/designer
          cp -R artifacts/webapi/_manifest/. artifacts/sbom/webapi/
          cp -R pxa-designer/dist/_manifest/. artifacts/sbom/designer/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxa-sbom-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/sbom
          if-no-files-found: error
          retention-days: 90
