name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Canvas/Canvas.csproj

      - name: Build
        run: dotnet build Canvas/Canvas.csproj --configuration Release --no-restore

      - name: Test Core
        run: dotnet test tests/Canvas.Core.Tests/Canvas.Core.Tests.csproj --configuration Release

      - name: Test Application
        run: dotnet test tests/Canvas.Application.Tests/Canvas.Application.Tests.csproj --configuration Release

      - name: Test Infrastructure.Pdf
        run: dotnet test tests/Canvas.Infrastructure.Pdf.Tests/Canvas.Infrastructure.Pdf.Tests.csproj --configuration Release

      - name: Demo smoke test
        run: dotnet run --project samples/Canvas.Demo/Canvas.Demo.csproj --configuration Release
