name: PVADE CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install configuration contract dependencies
        run: npm ci --prefix pvad-designer --ignore-scripts
      - name: Validate reviewed rename exceptions
        run: node tools/configuration/rename-residual-review.mjs

      - name: Test version tooling
        run: |
          node --test tools/configuration/*.test.mjs
          node --test tools/versioning/pvad-version.test.mjs
          node --test tools/versioning/pvad-release-author.test.mjs
          node --test tools/versioning/pvad-build-consistency.test.mjs
          node --test tools/deployment/pvad-deployment.test.mjs
      - name: Check synchronized version metadata
        run: node tools/versioning/pvad-version.mjs check
      - name: Validate canonical and legacy telemetry queries
        run: |
          node tools/configuration/pvad-telemetry-contract.mjs artifacts/rename-pvad/observability/dashboard-queries.json artifacts/rename-pvad/observability/identity-tests.json
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$GITHUB_WORKSPACE/deploy/observability/prometheus:/etc/prometheus:ro" \
            --volume "$GITHUB_WORKSPACE/artifacts/rename-pvad/observability:/checks:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.12.0 check rules \
            /etc/prometheus/rules/pvad-alerts.yml \
            /etc/prometheus/rules/pvad-webapi-container-alerts.yml \
            /etc/prometheus/rules/pvad-mcp-alerts.yml /checks/dashboard-queries.json
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$GITHUB_WORKSPACE/deploy/observability/prometheus:/etc/prometheus:ro" \
            --volume "$GITHUB_WORKSPACE/artifacts/rename-pvad/observability:/checks:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.12.0 test rules \
            /etc/prometheus/tests/pvad-alerts.test.yml /checks/identity-tests.json
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$GITHUB_WORKSPACE/deploy/observability/alertmanager:/etc/alertmanager:ro" \
            --entrypoint /bin/amtool prom/alertmanager:v0.32.1 check-config \
            /etc/alertmanager/alertmanager.yml /etc/alertmanager/alertmanager.production.yml.example
      - name: Validate PDF Trust governance and pinned evidence
        run: |
          node tools/pdf-trust/validate-standards-baseline.mjs
          node tools/pdf-trust/validate-external-evidence.mjs
          node --test tools/pdf-trust/*.test.mjs
      - name: Validate document fidelity corpus and reviewed baseline
        run: |
          node tools/document-fidelity/fidelity.mjs validate
          node tools/document-fidelity/fidelity.mjs evaluate \
            --migration-fidelity test-assets/document-fidelity/migration-provider-smoke.json
          node --test tools/document-fidelity/fidelity.test.mjs
          node --test tools/document-fidelity/real-world-review.test.mjs
      - name: Require a release fragment for develop pull requests
        if: >
          github.event_name == 'pull_request' &&
          github.base_ref == 'develop' &&
          !startsWith(github.head_ref, 'release/prepare-v')
        run: node tools/versioning/pvad-version.mjs validate-change --base-ref origin/develop
      - name: Validate stable release pull request
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE_VERSION="$(git show origin/main:VERSION 2>/dev/null || true)"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          fi
          if [ -z "$BASE_VERSION" ]; then
            echo "No stable PVADE version exists on main."
            exit 1
          fi
          node tools/versioning/pvad-version.mjs validate-pr \
            --base "$BASE_VERSION" \
            --labels "$RELEASE_LABELS" \
            --head-ref "$HEAD_REF"
          if git rev-parse --verify --quiet "refs/tags/v$(cat VERSION)"; then
            echo "Tag v$(cat VERSION) already exists."
            exit 1
          fi

  dotnet:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install independent PDF parser tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            poppler-utils qpdf imagemagick libreoffice-writer libreoffice-calc fonts-liberation
      - name: Restore
        run: dotnet restore PVAD.sln
      - name: Build
        run: dotnet build PVAD.sln --configuration Release --no-restore -p:SkipOcrWorkerPackaging=true
      - name: Test core contracts
        run: |
          dotnet test tests/PVAD.Core.Tests/PVAD.Core.Tests.csproj --configuration Release --no-build
          dotnet test tests/PVAD.Application.Tests/PVAD.Application.Tests.csproj --configuration Release --no-build
          dotnet test tests/PVAD.Domain.Tests/PVAD.Domain.Tests.csproj --configuration Release --no-build
          dotnet test tests/PVAD.Observability.WebhookRelay.Tests/PVAD.Observability.WebhookRelay.Tests.csproj --configuration Release --no-build
      - name: Validate migration provider fidelity adapters
        run: |
          dotnet test tests/PVAD.Migration.Pdf.Tests/PVAD.Migration.Pdf.Tests.csproj --configuration Release --no-build
          dotnet test tests/PVAD.Migration.Spreadsheet.Tests/PVAD.Migration.Spreadsheet.Tests.csproj --configuration Release --no-build
          dotnet test tests/PVAD.Migration.Report.Tests/PVAD.Migration.Report.Tests.csproj --configuration Release --no-build
          node tools/document-fidelity/fidelity.mjs evaluate \
            --migration-fidelity test-assets/document-fidelity/migration-provider-smoke.json \
            --output artifacts/migration-fidelity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-migration-fidelity-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/migration-fidelity
          if-no-files-found: error
          retention-days: 30
      - name: Measure Spreadsheet XLSX roundtrip fidelity
        env:
          PVAD_SPREADSHEET_FIDELITY_ARTIFACTS: artifacts/spreadsheet-fidelity/raw
        run: |
          dotnet test tests/PVAD.Export.Tests/PVAD.Export.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~SpreadsheetFidelityTests
          node tools/document-fidelity/fidelity.mjs evaluate \
            --spreadsheet-fidelity artifacts/spreadsheet-fidelity/raw/fidelity-report.json \
            --output artifacts/spreadsheet-fidelity/report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-spreadsheet-fidelity-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/spreadsheet-fidelity
          if-no-files-found: error
          retention-days: 30
      - name: Measure real-world PDF, DOCX, and XLSX import evidence
        env:
          PVAD_REAL_WORLD_FIDELITY_ARTIFACTS: artifacts/document-fidelity/real-world/raw
        run: |
          dotnet test tests/PVAD.Export.Tests/PVAD.Export.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~RealWorldCorpusFidelityTests
          node tools/document-fidelity/real-world-review.mjs
          node tools/document-fidelity/fidelity.mjs evaluate \
            --real-world-review artifacts/document-fidelity/real-world/review/real-world-review.json \
            --output artifacts/document-fidelity/real-world/report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-real-world-document-fidelity-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/document-fidelity/real-world
          if-no-files-found: error
          retention-days: 30
      - name: Validate generated PDF/UA-1 fixtures independently
        env:
          PVAD_PDFUA_ARTIFACT_DIR: artifacts/pdfua/fixtures
          PVAD_PDFUA_REPORT_DIR: artifacts/pdfua/reports
        run: |
          tools/pdfua/test-validate-pdfua.sh
          dotnet test tests/PVAD.Importer.Tests/PVAD.Importer.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~PdfUaGenerationTests
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~PdfComplianceExportTests.DesignerModel_ExportsAccessibleTableLinkAndFormAnnotations \
            -p:SkipOcrWorkerPackaging=true
          tools/pdfua/validate-pdfua.sh artifacts/pdfua/fixtures/*.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-pdfua-validation-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/pdfua
          if-no-files-found: error
          retention-days: 30
      - name: Validate generated PDF/A fixtures independently
        env:
          PVAD_PDFA_ARTIFACT_DIR: artifacts/pdfa/generated
          PVAD_PDFA_CONVERT_ARTIFACT_DIR: artifacts/pdfa/conversions
          PVAD_PDFA_REPORT_DIR: artifacts/pdfa/reports
        run: |
          mkdir -p artifacts/pdfa/generated artifacts/pdfa/conversions artifacts/pdfa/reports
          tools/pdfa/test-validate-pdfa.sh
          dotnet test tests/PVAD.Importer.Tests/PVAD.Importer.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~PdfTrustInspectorTests|FullyQualifiedName~PdfA2bConverterTests|FullyQualifiedName~PdfA3bAndColorConversionTests"
          cp tests/PVAD.Importer.Tests/Fixtures/PdfTrustExternal/libreoffice-pdfa2b.pdf artifacts/pdfa/generated/
          tools/pdfa/validate-pdfa.sh 2b \
            artifacts/pdfa/generated/pvad-pdfa2b-fixture.pdf \
            artifacts/pdfa/generated/pvad-pdfa2b-colored-pattern-fixture.pdf \
            artifacts/pdfa/generated/pvad-pdfa2b-uncolored-pattern-fixture.pdf \
            artifacts/pdfa/generated/pvad-pdfa2b-cmyk-image-fixture.pdf \
            artifacts/pdfa/generated/libreoffice-pdfa2b.pdf \
            artifacts/pdfa/conversions/pvad-converted-pdfa2b.pdf
          tools/pdfa/validate-pdfa.sh 3b \
            artifacts/pdfa/generated/pvad-generated-pdfa3b-fixture.pdf \
            artifacts/pdfa/generated/pvad-pdfa3b-fixture.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-pdfa-validation-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/pdfa
          if-no-files-found: error
          retention-days: 30
      - name: Run isolated PDF parser mutation corpus
        run: tools/pdf-parser-fuzzer/run.sh
      - name: Run AES-256 interoperability matrix
        run: node tools/pdf-security/aes256-interop.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-pdf-parser-fuzz-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/pdf-fuzz
            artifacts/pdf-security
          if-no-files-found: error
          retention-days: 30
      - name: Test version and release metadata contracts
        run: >
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~PVAD.Api.Tests.VersionControllerTests.|FullyQualifiedName~PVAD.Api.Tests.DesignerProductExperienceTests.|FullyQualifiedName~PVAD.Api.Tests.OperatorDocumentationContractTests."
          -p:SkipOcrWorkerPackaging=true
      - name: Test canonical and legacy security headers
        run: >
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~PvadSecurityHeaderMiddlewareTests|FullyQualifiedName~PvadHeaderPipelineTests|FullyQualifiedName~PvadApiKeyHeaderIntegrationTests|FullyQualifiedName~PvadApiKeySchemeCompatibilityTests|FullyQualifiedName~PvadAuthorizationPathCompatibilityTests|FullyQualifiedName~PvadDataProtectionCompatibilityTests|FullyQualifiedName~PvadCookieCompatibilityTests|FullyQualifiedName~PvadCookieConfigurationTests|FullyQualifiedName~PvadAntiforgeryCookieCompatibilityTests|FullyQualifiedName~PvadClaimCompatibilityTests|FullyQualifiedName~PvadOAuthScopeCatalogTests|FullyQualifiedName~PvadOAuthScopeMigrationTests|FullyQualifiedName~PvadMcpDelegationCompatibilityTests|FullyQualifiedName~DesignerProductExperienceTests|FullyQualifiedName~PvadApiPrefixIntegrationTests"
          -p:SkipOcrWorkerPackaging=true
      - name: Test PostgreSQL legal deployment contract
        env:
          PVAD_RUN_POSTGRES_TESTS: "1"
        run: >
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~AccountRegistrationControllerTests.Registration_requires_current_legal_versions_and_records_exact_acceptances|FullyQualifiedName~AdminSystemControllerTests"
          -p:SkipOcrWorkerPackaging=true
      - name: Test PostgreSQL MCP OAuth and tenant delegation contracts
        env:
          PVAD_RUN_POSTGRES_TESTS: "1"
        run: >
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~AccountServiceAccountsAndSecurityControllerTests.OAuth_discovery_and_public_PKCE_authorization_are_available|FullyQualifiedName~AccountServiceAccountsAndSecurityControllerTests.Service_account_and_key_lifecycle_reveals_the_secret_exactly_once|FullyQualifiedName~PvadOAuthScopeMigrationTests.PostgreSql_store_preserves_credentials_and_grants"
          -p:SkipOcrWorkerPackaging=true
      - name: Test retained licenses and background job compatibility
        env:
          PVAD_RUN_POSTGRES_TESTS: "1"
        run: >
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~PvadLicenseReplacementTests|FullyQualifiedName~PvadLicenseRenameCompatibilityTests|FullyQualifiedName~PvadOfflineLicenseValidatorTests|FullyQualifiedName~PvadJobProcessorTests|FullyQualifiedName~PvadJobCutoverCompatibilityTests|FullyQualifiedName~AccountSubscriptionAndLicensesControllerTests"
          -p:SkipOcrWorkerPackaging=true
      - name: Test isolated Legal backup and restore
        env:
          PVAD_POSTGRES_STARTUP_DELAY_SECONDS: "2"
          PVAD_POSTGRES_READY_ATTEMPTS: "90"
        run: tools/legal/run-backup-restore-smoke-test.sh

  dependency-security:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pvad-designer/package-lock.json
            websites/PVAD.Admin/package-lock.json
            tools/PVAD.Mcp/package-lock.json
      - name: Restore NuGet dependency graph
        run: dotnet restore PVAD.sln
      - name: Reject vulnerable direct and transitive NuGet dependencies
        run: node tools/dependencies/check-nuget-vulnerabilities.mjs
      - name: Reject high and critical production npm vulnerabilities
        run: |
          npm --prefix pvad-designer audit --omit=dev --audit-level=high
          npm --prefix websites/PVAD.Admin audit --omit=dev --audit-level=high
          npm --prefix tools/PVAD.Mcp audit --omit=dev --audit-level=high
      - name: Validate dependency compliance policy
        run: |
          node tools/dependencies/validate-dependency-compliance.mjs
          node --test tools/dependencies/dependency-compliance.test.mjs

  frontend:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pvad-designer/package-lock.json
            websites/PVAD.Admin/package-lock.json
            tools/PVAD.Mcp/package-lock.json
      - name: Install Designer dependencies
        working-directory: pvad-designer
        run: npm ci
      - name: Test and build Designer
        working-directory: pvad-designer
        run: |
          npm run type-check
          npm test -- --runInBand
          npm run build
      - name: Install and test Admin
        working-directory: websites/PVAD.Admin
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Account, Company, and Documentation
        run: |
          node tools/legal/validate-browser-storage.mjs
          node tools/legal/validate-data-processing-inventory.mjs
          node tools/legal/validate-legal-launch-readiness.mjs
          node tools/commerce/validate-global-commerce-catalog.mjs
          node tools/commerce/validate-country-readiness.mjs
          node --test tools/commerce/*.test.mjs
          npm --prefix websites/PVAD.Account test
          npm --prefix websites/PVAD.Account run type-check
          npm --prefix websites/PVAD.Company test
          npm --prefix websites/PVAD.Documentation test
      - name: Build PVADE websites
        run: |
          for site in PVAD.Account PVAD.Company PVAD.Demo PVAD.Documentation; do
            npm --prefix "websites/$site" run build
          done
      - name: Verify frontend build versions
        run: |
          node tools/versioning/pvad-build-consistency.mjs verify \
            pvad-designer/dist \
            websites/PVAD.Account/dist \
            websites/PVAD.Admin/dist \
            websites/PVAD.Company/dist \
            websites/PVAD.Demo/dist \
            websites/PVAD.Documentation/dist
      - name: Install Playwright Chromium
        working-directory: pvad-designer
        run: npx playwright install --with-deps chromium
      - name: Test legal browser workflows
        working-directory: pvad-designer
        run: npm run test:e2e:legal
      - name: Collect frontend snapshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p artifacts/frontends
          cp -R pvad-designer/dist artifacts/frontends/pvad-designer
          for site in PVAD.Account PVAD.Admin PVAD.Company PVAD.Demo PVAD.Documentation; do
            cp -R "websites/$site/dist" "artifacts/frontends/$site"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: pvad-frontends-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/frontends
          if-no-files-found: error
          retention-days: 14
      - name: Install and type-check MCP tool
        working-directory: tools/PVAD.Mcp
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run smoke:dist
          npm pack --dry-run

  mcp-beta:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/PVAD.Mcp/package-lock.json
      - name: Install MCP client dependencies
        working-directory: tools/PVAD.Mcp
        run: npm ci
      - name: Validate PVADE Server Compose contract
        working-directory: deploy/api
        env:
          PVAD_LICENSE_PRIVATE_KEY_FILE: ./secrets/license-private.pem
          PVAD_LICENSE_PUBLIC_KEY_FILE: ./secrets/license-public.pem
        run: node ../../tools/configuration/pvad-compose.mjs -f docker-compose.api.yml --profile mcp config --quiet
      - name: Test MCP TLS, dependency failure, and graceful shutdown
        run: deploy/api/mcp-tls-smoke-test.sh
      - name: Scan MCP container image
        run: |
          mkdir -p artifacts/mcp-security
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v pvad-mcp-trivy-cache:/root/.cache/ \
            aquasec/trivy:0.74.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret \
            mcp-smoke-pvad-mcp:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v pvad-mcp-trivy-cache:/root/.cache/ \
            -v "$PWD/artifacts/mcp-security:/output" \
            aquasec/trivy:0.74.0 image \
            --format cyclonedx \
            --output /output/pvad-mcp.cdx.json \
            mcp-smoke-pvad-mcp:latest
      - name: Check MCP repository diff
        run: git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pvad-mcp-security-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/mcp-security
          if-no-files-found: warn
          retention-days: 30

  visual-parity:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pvad-designer/package-lock.json
      - name: Install visual comparison tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils fonts-liberation
      - name: Install Designer and pinned Chromium
        working-directory: pvad-designer
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Restore visual-parity test dependencies
        run: dotnet restore tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj
      - name: Restore PDF Trust visual operation dependencies
        run: dotnet restore tests/PVAD.Importer.Tests/PVAD.Importer.Tests.csproj
      - name: Enforce approved visual parity
        working-directory: pvad-designer
        run: npm run test:visual-parity:ci
      - name: Aggregate live visual fidelity evidence
        run: >
          node tools/document-fidelity/fidelity.mjs evaluate
          --visual-parity artifacts/visual-parity/visual-parity-report.json
          --output artifacts/document-fidelity
      - name: Enforce PDF Trust visual baselines
        env:
          PVAD_PDF_TRUST_VISUAL_ENFORCE: true
        run: node tools/visual-parity/pdf-trust-golden.mjs
      - name: Enforce PDF Trust operation visual baselines
        env:
          PVAD_PDF_TRUST_OPERATION_ENFORCE: true
