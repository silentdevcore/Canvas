name: PXA CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test version tooling
        run: node --test tools/versioning/pxa-version.test.mjs
      - name: Check synchronized version metadata
        run: node tools/versioning/pxa-version.mjs check
      - name: Validate stable release pull request
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE_VERSION="$(git show origin/main:VERSION)"
          node tools/versioning/pxa-version.mjs validate-pr \
            --base "$BASE_VERSION" \
            --labels "$RELEASE_LABELS" \
            --head-ref "$HEAD_REF"
          if git rev-parse --verify --quiet "refs/tags/v$(cat VERSION)"; then
            echo "Tag v$(cat VERSION) already exists."
            exit 1
          fi

  dotnet:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PXA.sln
      - name: Build
        run: dotnet build PXA.sln --configuration Release --no-restore -p:SkipOcrWorkerPackaging=true
      - name: Test
        run: dotnet test PXA.sln --configuration Release --no-build -p:SkipOcrWorkerPackaging=true

  frontend:
    runs-on: ubuntu-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pxa-designer/package-lock.json
            websites/PXA.Admin/package-lock.json
            tools/PXA.Mcp/package-lock.json
      - name: Install Designer dependencies
        working-directory: pxa-designer
        run: npm ci
      - name: Test and build Designer
        working-directory: pxa-designer
        run: |
          npm run type-check
          npm test -- --runInBand
          npm run build
      - name: Install and test Admin
        working-directory: websites/PXA.Admin
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Account and Documentation
        run: |
          npm --prefix websites/PXA.Account test
          npm --prefix websites/PXA.Account run type-check
          npm --prefix websites/PXA.Documentation test
      - name: Build PXA websites
        run: |
          for site in PXA.Account PXA.Company PXA.Demo PXA.Documentation; do
            npm --prefix "websites/$site" run build
          done
      - name: Collect frontend snapshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p artifacts/frontends
          cp -R pxa-designer/dist artifacts/frontends/pxa-designer
          for site in PXA.Account PXA.Admin PXA.Company PXA.Demo PXA.Documentation; do
            cp -R "websites/$site/dist" "artifacts/frontends/$site"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: pxa-frontends-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/frontends
          if-no-files-found: error
          retention-days: 14
      - name: Install and type-check MCP tool
        working-directory: tools/PXA.Mcp
        run: |
          npm ci
          npm run typecheck

  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build traceable snapshot
        env:
          PXA_BUILD_COMMIT: ${{ github.sha }}
          PXA_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          VERSION="$(cat VERSION)"
          dotnet restore PXA.WebApi/PXA.WebApi.csproj
          dotnet publish PXA.WebApi/PXA.WebApi.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/webapi \
            -p:SkipOcrWorkerPackaging=true \
            -p:PxaBuildMetadata="develop.${{ github.run_number }}.${GITHUB_SHA::12}"
          printf '%s\n' "$VERSION-develop.${{ github.run_number }}-${GITHUB_SHA::12}" > artifacts/SNAPSHOT
      - uses: actions/upload-artifact@v4
        with:
          name: pxa-${{ github.run_number }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
