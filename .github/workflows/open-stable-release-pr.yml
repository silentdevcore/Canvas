name: Open PXA Stable Release Pull Request

on:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  open:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prepare-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate prepared release
        id: release
        run: |
          BASE_VERSION="$(git show origin/main:VERSION 2>/dev/null || true)"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          fi
          if [ -z "$BASE_VERSION" ]; then
            echo "No stable PXA version exists on main."
            exit 1
          fi
          node tools/versioning/pxa-version.mjs validate-next --base "$BASE_VERSION"
          IMPACT="$(node tools/versioning/pxa-version.mjs release-impact --base "$BASE_VERSION")"
          echo "impact=$IMPACT" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          node tools/versioning/pxa-version.mjs notes > /tmp/pxa-release-notes.md
      - name: Open stable release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          IMPACT: ${{ steps.release.outputs.impact }}
        run: |
          {
            printf 'Publishes the reviewed PXA %s release.\n\n' "$VERSION"
            cat /tmp/pxa-release-notes.md
          } > /tmp/pxa-stable-pr.md
          EXISTING="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            for LABEL in $(gh pr view "$EXISTING" --json labels --jq '.labels[].name | select(startswith("release:"))'); do
              gh pr edit "$EXISTING" --remove-label "$LABEL"
            done
            gh pr edit "$EXISTING" \
              --title "Release PXA $VERSION" \
              --body-file /tmp/pxa-stable-pr.md \
              --add-label "release:$IMPACT"
            echo "Updated stable release pull request #$EXISTING."
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "Release PXA $VERSION" \
            --label "release:$IMPACT" \
            --body-file /tmp/pxa-stable-pr.md
