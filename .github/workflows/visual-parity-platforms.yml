name: PVADE Platform Parity

on:
  push:
    branches: ['validation/platform-parity-*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-parity:
    name: parity-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_PROCESSOR_COUNT: 2
    steps:
      - name: Preserve source byte identities
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Linux PDF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils fonts-liberation
      - name: Install Windows PDF tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --version=26.9.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Poppler installation failed: $LASTEXITCODE" }
          $binary = Get-ChildItem "$env:ChocolateyInstall\lib\poppler" -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $binary) { throw 'Poppler executable was not installed' }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          magick -version
          if ($LASTEXITCODE -ne 0) { throw 'ImageMagick is unavailable' }
      - name: Install Designer and pinned Chromium
        shell: bash
        run: |
          npm ci --prefix pvad-designer
          cd pvad-designer
          npx playwright install --with-deps chromium
      - name: Restore backend dependencies
        run: dotnet restore tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj --disable-parallel
      - name: Test tooling and shared date vectors
        shell: bash
        run: |
          node --test tools/visual-parity/*.test.mjs
          dotnet test tests/PVAD.Api.Tests/PVAD.Api.Tests.csproj --no-restore -m:1 -p:BuildInParallel=false --filter FullyQualifiedName~DateFormattingParityTests --nologo
      - name: Compare native platform outputs
        run: node tools/visual-parity/platforms.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pvad-platform-parity-${{ matrix.os }}-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/platform-parity
          if-no-files-found: warn
          retention-days: 30
