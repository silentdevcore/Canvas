# Fresh installations use PVAD. Existing data requires the explicit legacy overlay.
services:
  pvad-database:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${PVAD_DATABASE_NAME:-pvad}
      POSTGRES_USER: ${PVAD_DATABASE_USER:-pvad}
      POSTGRES_PASSWORD: ${PVAD_DATABASE_PASSWORD:-pvad-local}
    ports:
      - '5432:5432'
    volumes:
      - 'pvad-database-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      default: {}
      pvad-observability: {}
  pvad-mailpit:
    image: 'axllent/mailpit:v1.30.0'
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - 'pvad-mailpit-data:/data'
    networks:
      default: {}
      pvad-observability: {}
  pvad-otel-collector:
    image: 'otel/opentelemetry-collector-contrib:0.157.0'
    command:
      - '--config=/etc/otelcol-contrib/config.yml'
    profiles:
      - observability
    depends_on:
      - pvad-loki
      - pvad-tempo
    ports:
      - "127.0.0.1:4317:4317"
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:13133:13133'
    environment:
      PVAD_TRACE_SAMPLE_PERCENTAGE: '${PVAD_TRACE_SAMPLE_PERCENTAGE:-10}'
      PVAD_OTEL_MEMORY_LIMIT_MIB: '${PVAD_OTEL_MEMORY_LIMIT_MIB:-384}'
      PVAD_OTEL_MEMORY_SPIKE_LIMIT_MIB: '${PVAD_OTEL_MEMORY_SPIKE_LIMIT_MIB:-96}'
    volumes:
      - './deploy/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro'
    networks:
      pvad-observability: {}
      pvad-observability-ingress: {}
      pvad-observability-host: {}
    deploy:
      resources:
        limits:
          cpus: '${PVAD_OTEL_CPU_LIMIT:-1.0}'
          memory: '${PVAD_OTEL_MEMORY_LIMIT:-512M}'
    restart: unless-stopped
  pvad-postgres-exporter:
    image: 'quay.io/prometheuscommunity/postgres-exporter:v0.19.1'
    profiles:
      - observability
    depends_on:
      pvad-database:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: pvad-database:5432/${PVAD_DATABASE_NAME:-pvad}?sslmode=disable
      DATA_SOURCE_USER: ${PVAD_DATABASE_USER:-pvad}
      DATA_SOURCE_PASS: ${PVAD_DATABASE_PASSWORD:-pvad-local}
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    networks:
      pvad-observability: {}
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://localhost:9187/metrics'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_POSTGRES_EXPORTER_CPU_LIMIT:-0.25}'
          memory: '${PVAD_POSTGRES_EXPORTER_MEMORY_LIMIT:-128M}'
    restart: unless-stopped
  pvad-cadvisor:
    image: 'ghcr.io/google/cadvisor:0.55.1'
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
    profiles:
      - observability
    privileged: true
    devices:
      - '/dev/kmsg:/dev/kmsg'
    volumes:
      - '/:/rootfs:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '/var/run/docker/containerd:/run/containerd:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
      - '/dev/disk:/dev/disk:ro'
    networks:
      pvad-observability: {}
    deploy:
      resources:
        limits:
          cpus: '${PVAD_CADVISOR_CPU_LIMIT:-0.5}'
          memory: '${PVAD_CADVISOR_MEMORY_LIMIT:-256M}'
    restart: unless-stopped
  pvad-blackbox-exporter:
    image: 'prom/blackbox-exporter:v0.26.0'
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    profiles:
      - observability
    volumes:
      - './deploy/observability/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro'
    networks:
      pvad-observability: {}
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://localhost:9115/-/healthy'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_BLACKBOX_CPU_LIMIT:-0.25}'
          memory: '${PVAD_BLACKBOX_MEMORY_LIMIT:-128M}'
    restart: unless-stopped
  pvad-prometheus:
    image: 'prom/prometheus:v3.12.0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PVAD_METRIC_RETENTION:-90d}'
      - '--storage.tsdb.retention.size=${PVAD_METRIC_RETENTION_SIZE:-0B}'
      - '--web.enable-lifecycle'
    profiles:
      - observability
    depends_on:
      - pvad-otel-collector
      - pvad-alertmanager
      - pvad-postgres-exporter
      - pvad-cadvisor
      - pvad-blackbox-exporter
    volumes:
      - './deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './deploy/observability/prometheus/rules:/etc/prometheus/rules:ro'
      - './deploy/observability/prometheus/tests:/etc/prometheus/tests:ro'
      - '${PVAD_TLS_TARGETS_PATH:-./deploy/observability/prometheus/targets}:/etc/prometheus/targets:ro'
      - '${PVAD_PROMETHEUS_DATA_PATH:-pvad-prometheus-data}:/prometheus'
    networks:
      pvad-observability: {}
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://localhost:9090/-/ready'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_PROMETHEUS_CPU_LIMIT:-1.0}'
          memory: '${PVAD_PROMETHEUS_MEMORY_LIMIT:-1G}'
    restart: unless-stopped
  pvad-alertmanager:
    image: 'prom/alertmanager:v0.32.1'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=${PVAD_ALERT_RETENTION:-120h}'
      - '--web.external-url=${PVAD_ALERTMANAGER_ROOT_URL:-http://pvad-alertmanager:9093}'
    profiles:
      - observability
    depends_on:
      pvad-mailpit:
        condition: service_healthy
    volumes:
      - './deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro'
      - './deploy/observability/alertmanager/templates:/etc/alertmanager/templates:ro'
      - '${PVAD_ALERTMANAGER_DATA_PATH:-pvad-alertmanager-data}:/alertmanager'
    networks:
      pvad-observability: {}
      pvad-observability-ingress: {}
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://localhost:9093/-/ready'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_ALERTMANAGER_CPU_LIMIT:-0.5}'
          memory: '${PVAD_ALERTMANAGER_MEMORY_LIMIT:-256M}'
    restart: unless-stopped
  pvad-loki:
    image: 'grafana/loki:3.7.2'
    command:
      - '-config.file=/etc/loki/config.yml'
      - '-config.expand-env=true'
    profiles:
      - observability
    environment:
      PVAD_LOG_RETENTION: '${PVAD_LOG_RETENTION:-720h}'
      PVAD_S3_ENDPOINT: '${PVAD_S3_ENDPOINT:-}'
      PVAD_S3_REGION: '${PVAD_S3_REGION:-}'
      PVAD_S3_FORCE_PATH_STYLE: '${PVAD_S3_FORCE_PATH_STYLE:-false}'
      PVAD_S3_INSECURE: '${PVAD_S3_INSECURE:-false}'
      PVAD_LOKI_S3_BUCKET: '${PVAD_LOKI_S3_BUCKET:-}'
    volumes:
      - '${PVAD_LOKI_CONFIG_PATH:-./deploy/observability/loki/config.yml}:/etc/loki/config.yml:ro'
      - '${PVAD_LOKI_DATA_PATH:-pvad-loki-data}:/loki'
    networks:
      pvad-observability: {}
    deploy:
      resources:
        limits:
          cpus: '${PVAD_LOKI_CPU_LIMIT:-1.0}'
          memory: '${PVAD_LOKI_MEMORY_LIMIT:-1G}'
    restart: unless-stopped
  pvad-tempo:
    image: 'grafana/tempo:2.10.5'
    command:
      - '-config.file=/etc/tempo/config.yml'
      - '-config.expand-env=true'
    profiles:
      - observability
    environment:
      PVAD_TRACE_RETENTION: '${PVAD_TRACE_RETENTION:-336h}'
      PVAD_S3_ENDPOINT: '${PVAD_S3_ENDPOINT:-}'
      PVAD_S3_REGION: '${PVAD_S3_REGION:-}'
      PVAD_S3_FORCE_PATH_STYLE: '${PVAD_S3_FORCE_PATH_STYLE:-false}'
      PVAD_S3_INSECURE: '${PVAD_S3_INSECURE:-false}'
      PVAD_TEMPO_S3_BUCKET: '${PVAD_TEMPO_S3_BUCKET:-}'
    volumes:
      - '${PVAD_TEMPO_CONFIG_PATH:-./deploy/observability/tempo/config.yml}:/etc/tempo/config.yml:ro'
      - '${PVAD_TEMPO_DATA_PATH:-pvad-tempo-data}:/var/tempo'
    networks:
      pvad-observability: {}
    deploy:
      resources:
        limits:
          cpus: '${PVAD_TEMPO_CPU_LIMIT:-1.0}'
          memory: '${PVAD_TEMPO_MEMORY_LIMIT:-1G}'
    restart: unless-stopped
  pvad-grafana:
    image: 'grafana/grafana:13.1.0'
    profiles:
      - observability
    depends_on:
      - pvad-prometheus
      - pvad-alertmanager
      - pvad-loki
      - pvad-tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${PVAD_GRAFANA_ADMIN_USER:-pvad-operator}
      GF_SECURITY_ADMIN_PASSWORD: ${PVAD_GRAFANA_ADMIN_PASSWORD:-pvad-local-observability}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_PROXY_SYNC_TTL: '0'
      GF_AUTH_PROXY_WHITELIST: 172.30.50.10
      GF_AUTH_PROXY_HEADERS: 'Role:X-WEBAUTH-ROLE'
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG: 'true'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SERVER_ROOT_URL: '${PVAD_OPERATOR_PUBLIC_URL:-http://localhost:3001}/operator/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - './deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - '${PVAD_GRAFANA_DATA_PATH:-pvad-grafana-data}:/var/lib/grafana'
    networks:
      pvad-observability: {}
      pvad-observability-ingress:
        ipv4_address: 172.30.50.11
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://localhost:3000/api/health'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_GRAFANA_CPU_LIMIT:-1.0}'
          memory: '${PVAD_GRAFANA_MEMORY_LIMIT:-768M}'
    restart: unless-stopped
  pvad-operator-gateway:
    image: 'nginx:1.29-alpine'
    profiles:
      - observability
    depends_on:
      pvad-grafana:
        condition: service_healthy
    environment:
      PVAD_OPERATOR_SERVER_NAME: '${PVAD_OPERATOR_SERVER_NAME:-localhost}'
      PVAD_OPERATOR_API_UPSTREAM: '${PVAD_OPERATOR_API_UPSTREAM:-http://host.docker.internal:5086}'
      PVAD_OPERATOR_UI_UPSTREAM: '${PVAD_OPERATOR_UI_UPSTREAM:-http://host.docker.internal:5177}'
    ports:
      - '127.0.0.1:3001:8080'
    volumes:
      - './deploy/observability/operator-gateway/templates:/etc/nginx/templates:ro'
      - './deploy/observability/operator-gateway/15-pvad-operator.envsh:/docker-entrypoint.d/15-pvad-operator.envsh:ro'
      - './tools/configuration/environment.sh:/etc/pvad/environment.sh:ro'
      - './deploy/observability/operator-gateway/site:/usr/share/nginx/html/documentation:ro'
    networks:
      pvad-observability-ingress:
        ipv4_address: 172.30.50.10
      pvad-operator-egress: {}
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:8080/operator-health'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '${PVAD_OPERATOR_GATEWAY_CPU_LIMIT:-0.25}'
          memory: '${PVAD_OPERATOR_GATEWAY_MEMORY_LIMIT:-128M}'
    restart: unless-stopped
volumes:
  pvad-database-data: null
  pvad-mailpit-data: null
  pvad-prometheus-data: null
  pvad-loki-data: null
  pvad-tempo-data: null
  pvad-grafana-data: null
  pvad-alertmanager-data: null
networks:
  pvad-observability:
    internal: true
  pvad-observability-ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.50.0/24
  pvad-observability-host: null
  pvad-operator-egress: null
